# Netlify konfiguracija. Sve što ovde piše ima prednost nad podešavanjima u panelu,
# pa se ne mora ništa kucati u UI osim povezivanja repoa.

[build]
  # bez base direktorijuma, projekat je u korenu repoa
  command = "python3 build-pages.py"
  publish = "_pages"

# Build skripta radi tri stvari koje izvorni fajlovi nemaju:
# prepisuje putanje za koren, lepi otisak sadržaja na CSS i JS radi keša,
# i izbacuje sve komentare iz HTML-a, CSS-a i JS-a.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Slike i video se ne menjaju često, a imena su stabilna.
[[headers]]
  for = "/slike/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# CSS i JS nose ?v= otisak sadržaja, pa smeju da se keširaju dugo.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Stare adrese sa starog sajta vode na nove, da se ne gubi ono što je indeksirano.
[[redirects]]
  from = "/usluge/odgusenje-kanalizacije/*"
  to = "/odgusenje-kanalizacije/"
  status = 301
  force = true

[[redirects]]
  from = "/usluge/detekcija-curenja-vode/*"
  to = "/detekcija-curenja-vode/"
  status = 301
  force = true

[[redirects]]
  from = "/usluge/snimanje-kanalizacije-kamerom/*"
  to = "/detekcija-curenja-vode/"
  status = 301
  force = true

[[redirects]]
  from = "/usluge/ugradnja-i-zamena-sanitarija/*"
  to = "/ugradnja-sanitarija/"
  status = 301
  force = true

[[redirects]]
  from = "/usluge/zamena-vodovodnih-cevi-i-ventila/*"
  to = "/vodovodne-instalacije/"
  status = 301
  force = true

[[redirects]]
  from = "/usluge/izrada-vodovodnih-instalacija/*"
  to = "/vodovodne-instalacije/"
  status = 301
  force = true

[[redirects]]
  from = "/usluge/adaptacija-kupatila/*"
  to = "/adaptacija-kupatila/"
  status = 301
  force = true

[[redirects]]
  from = "/usluge/*"
  to = "/"
  status = 301
  force = true
